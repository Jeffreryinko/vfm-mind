<!DOCTYPE html>
<html lang="ko" class="ap ap-mental">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.VFM_APP="mental";window.VFM_SHIM={fileCollections:{meta:"inline",eps:"inline",uses:"inline",analysis:"inline"}};</script>
<script src="../assets/claude-shim.js"></script>
<link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#F2F2F7"><link rel="apple-touch-icon" href="../assets/icon-192.png">
<title>멘탈리스트 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/apple.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Layout: 시사 자판기 계열 한 손 모바일 앱 — 상단 띠, 카드, 하단 5칸 탭, 아래에서 올라오는 시트. 남색은 기술, 초록은 훈련, 금색은 기록 */
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --sunk:#E4E7EF; --ink:#151A2E; --muted:#5B6278; --line:#D5D9E4;
  --accent:#4A4FB0; --accent-ink:#FFFFFF; --accent-soft:#E0E1F6; --coin:#B7791F; --coin-soft:#F6EBD6;
  --ok:#2F7D4F; --ok-soft:#DDF0E4; --warn:#A8621A; --warn-soft:#F6E7D3; --bad:#B23A3A; --bad-soft:#F5DCDC;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Pretendard Variable",Pretendard,system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152A; --surface:#191D36; --sunk:#1F2440; --ink:#ECEEF7; --muted:#A7ADC6; --line:#30365A;
  --accent:#A3A7F4; --accent-ink:#12152A; --accent-soft:#272C52; --coin:#E0A84A; --coin-soft:#3A2E17;
  --ok:#6CC58F; --ok-soft:#173527; --warn:#E3A35C; --warn-soft:#3A2A17; --bad:#EE8080; --bad-soft:#3D1D1F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152A; --surface:#191D36; --sunk:#1F2440; --ink:#ECEEF7; --muted:#A7ADC6; --line:#30365A;
  --accent:#A3A7F4; --accent-ink:#12152A; --accent-soft:#272C52; --coin:#E0A84A; --coin-soft:#3A2E17;
  --ok:#6CC58F; --ok-soft:#173527; --warn:#E3A35C; --warn-soft:#3A2A17; --bad:#EE8080; --bad-soft:#3D1D1F;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:relative;z-index:1;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;font-size:22px;line-height:1;display:flex;align-items:center;gap:8px;margin:0;font-weight:400}
.mark{width:26px;height:26px;flex:none}
.mark .b{fill:var(--accent)} .mark .e{fill:var(--accent-ink)} .mark .p{fill:var(--coin)}
.hspace{flex:1}
.edchip{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;line-height:1.3}
.edchip b{display:block;color:var(--ink);font-family:var(--f-body);font-weight:600;font-size:13px}

main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
section.view{display:flex;flex-direction:column;gap:16px;padding-block:16px}
h2.sec{font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:6px 0 0;display:flex;align-items:baseline;gap:8px}
h2.sec .n{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.lead{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;font-size:28px;line-height:1.22;margin:0;text-wrap:balance;font-weight:400}
h3{font-size:17px;margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.note{font-size:12.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.coin{background:var(--coin-soft);color:var(--coin)}.pill.acc{background:var(--accent-soft);color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card.acc{border-left:4px solid var(--accent)}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.banner{border-radius:var(--r);padding:11px 14px;font-size:13.5px;background:var(--coin-soft)}
.banner b{color:var(--coin);margin-right:6px}
.no{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.tdeep{margin-top:10px}.tdeep .body{display:grid;gap:10px}.lead2{margin:0;font-size:15.5px}.steps{margin:4px 0 0;padding-left:20px;display:grid;gap:4px}.mis{margin:4px 0 0;padding-left:18px}.life{margin:4px 0;font-size:14.5px;line-height:1.55}.dayn{color:var(--accent);margin-right:4px}.warnb{background:var(--warn-soft)!important;color:var(--warn)!important}
.lbl{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;margin-bottom:2px}
.box{background:var(--sunk);border-radius:10px;padding:9px 11px;font-size:14px}
.drill{background:var(--ok-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.drill .lbl{color:var(--ok)}
.risk{background:var(--warn-soft);border-radius:10px;padding:9px 11px;font-size:14px}
.risk .lbl{color:var(--warn)}
.lenses{display:grid;grid-template-columns:1fr;gap:8px}
.lens{border:1px dashed var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px}
.lens.on{border-style:solid;background:var(--surface)}
.lens .lbl{color:var(--accent)}
.lens p{margin:5px 0 0;line-height:1.6}
.lens .src{margin-top:6px;font-size:12px;color:var(--muted)}
details.cpt{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;margin:8px 0}
details.cpt summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;gap:10px;font-weight:600}
details.cpt summary::-webkit-details-marker{display:none}
details.cpt summary .n{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.lens .scn{background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin:4px 0 8px}
.lens .scn b{color:var(--accent);margin-right:4px}
details.cpt[open] summary{border-bottom:1px solid var(--line)}
details.cpt .body{padding:10px 0 12px}
details.cpt .body p{margin:0 0 6px;line-height:1.65;font-size:14px}
.lv{font-family:var(--f-mono);font-size:12px;color:var(--coin);letter-spacing:1px}

.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;width:100%}
.row .t{font-weight:600;font-size:14.5px;line-height:1.35}
.row .m{font-size:12px;color:var(--muted)}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .chev{color:var(--muted);font-size:18px}
.row.idle{opacity:.62}

.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:120px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:15px;resize:vertical}
.done{display:flex;align-items:center;gap:8px;font-size:14px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;font-weight:500}
.tile span{font-size:11.5px;color:var(--muted)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11.5px}
.cal .h{color:var(--muted);font-weight:600}
.cal .d{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cal .d.x{background:transparent;border:0}
.cal .d.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.cal .d.part{background:var(--coin-soft);border-color:var(--coin);color:var(--coin)}
.cal .d.today{outline:2px solid var(--accent);outline-offset:1px}

.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.srow .mono{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px;text-align:left}
.ep .mono{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ep.on{border-color:var(--accent);background:var(--accent-soft)}
.ep:disabled{opacity:.6;cursor:default}
.ep[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}

.memo{border-left:3px solid var(--coin);padding:4px 0 4px 10px;font-size:14px}
.memo .m{font-size:11.5px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;margin:0}
dl.kv dt{color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(10,12,25,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet .grab{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px 8px;z-index:1}
.sheet .grab b{flex:1;font-size:13px;color:var(--muted);font-weight:600}
.sheet .x{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px}
.sheet .body{max-width:720px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;gap:12px;align-items:stretch;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;font:inherit;color:inherit;cursor:pointer}
.mcard .mimg{flex:none;width:84px;height:84px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.mcard .mtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.mcard .t{font-weight:700;font-size:16px}.mcard .m{font-size:12.5px;color:var(--muted)}.mcard .o{font-size:13.5px;line-height:1.5;margin:2px 0}
.mhead{margin:10px 0}.mhead .lead{margin:8px 0 2px}
.mbig{width:100%;height:150px;object-fit:cover;border-radius:14px;background:var(--sunk);display:block}
.limg{float:right;width:76px;height:76px;object-fit:cover;border-radius:10px;margin:0 0 6px 10px;background:var(--sunk)}
img[data-wt]{display:none}
details.les summary{align-items:center}
details.les .body>*{margin-bottom:8px}
details.les .say{margin:2px 0 !important;font-size:14.5px}
details.les .say::before{content:"“";color:var(--muted)}details.les .say::after{content:"”";color:var(--muted)}
.cmx{display:grid;gap:8px;margin:2px 0 10px}
.cmx .pn{border:1.5px solid var(--ink,#222);border-radius:12px;padding:8px 9px 9px;background:var(--surface);display:grid;gap:6px}
.cmx .cap{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center;min-height:18px}
.cmx .cap b{flex:none;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.cmx .ln{display:flex;gap:8px;align-items:flex-end}
.cmx .ln.you{flex-direction:row-reverse}
.cmx .fc{flex:none;width:40px;height:40px}
.cmx .bb{background:var(--sunk);border-radius:14px 14px 14px 4px;padding:7px 11px;font-size:14.5px;line-height:1.45;max-width:78%;overflow-wrap:anywhere}
.cmx .you .bb{border-radius:14px 14px 4px 14px;background:var(--accent-soft)}
.cmx .bb.th{background:none;border:1.5px dashed var(--line);color:var(--muted);font-size:13.5px}
@media (min-width:700px){.cmx{grid-template-columns:repeat(3,1fr)}.cmx .bb{max-width:100%}}
.stp{list-style:none;margin:2px 0 10px;padding:0;display:grid;gap:6px}
.stp li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.500}
.stp .pc{flex:none;position:relative;width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.stp .pi{width:22px;height:22px}
.stp .pc b{position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;display:grid;place-items:center}
.xfig{margin:6px 0 10px}.xfig img{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#fff;display:block}.xfig figcaption{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.400}
.xmini{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}.xmini small{color:var(--muted);font-size:12px}.xmini p{margin:4px 0 6px;font-size:14px;line-height:1.500}
.xby{display:block;font-size:12px;color:var(--muted);font-weight:400}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--surface);color:inherit;margin:8px 0}
.ti{flex:none;width:22px;height:22px;color:var(--accent);margin-right:2px}
.ti.big{width:38px;height:38px}
.thead2{display:flex;gap:10px;align-items:center;margin:2px 0 6px}.thead2 b{display:block;font-size:14px}.thead2 small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.sti{display:inline-flex;align-items:center;gap:6px}
.tirow{display:flex;flex-wrap:wrap;gap:10px 14px;margin:4px 0 10px}.tib{display:inline-flex;flex-direction:column;align-items:center;gap:2px;width:58px;text-align:center}.tib .ti{width:30px;height:30px;margin:0}.tib small{font-size:11px;color:var(--muted);line-height:1.25}
.tib.off .ti{color:var(--line)}
.stair{width:100%;height:auto;display:block}
.barx{margin:4px 0 10px;display:grid;gap:5px}
.barx .br{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:13px}
.barx .bn{grid-column:1/-1;color:var(--muted)}
.barx .bt{height:14px;border-radius:7px;background:var(--sunk);overflow:hidden}
.barx .bt i{display:block;height:100%;border-radius:7px;background:var(--accent)}
.barx .bt i.b2{background:var(--coin,#c98a00)}
.barx b{font-variant-numeric:tabular-nums;font-size:13.5px;min-width:3.2em;text-align:right}
.gz{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:4px}
.gz i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.gz i.on.ok{background:var(--ok)}.gz i.on.acc{background:var(--accent)}.gz i.on.warn{background:var(--warn)}.gz i.on.bad{background:var(--bad)}
.chk{color:var(--ok);font-weight:700}
#v-lens .seg{margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:40;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header>
  <div class="wrap hrow">
    <h1 class="logo"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="b" x="3" y="3" width="26" height="26" rx="8"/><circle class="e" cx="16" cy="16" r="6.5"/><circle class="p" cx="16" cy="16" r="2.8"/></svg><span>멘탈리스트 노트</span></h1>
    <div class="hspace"></div>
    <div class="edchip" id="edchip"><b>불러오는 중</b>&nbsp;</div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-episodes" hidden></section>
  <section class="view" id="v-dex" hidden></section>
  <section class="view" id="v-lens" hidden></section>
  <section class="view" id="v-log" hidden></section>
</main>

<nav class="tabs" aria-label="화면">
  <div class="in">
    <button type="button" data-v="today" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/></svg><span>오늘</span></button>
    <button type="button" data-v="episodes"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="12" rx="2"/><path d="M8 20h8"/></svg><span>회차</span></button>

function kstDay(d=new Date()){ return new Date(d.getTime() + 9*3600e3).toISOString().slice(0,10); }
function addDays(day, n){ const d = new Date(day + "T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
const TODAY = kstDay();
const DOW = ["일","월","화","수","목","금","토"];
function dayLabel(day){ const d = new Date(day+"T00:00:00Z"); return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 ${DOW[d.getUTCDay()]}요일`; }

// ───────── 도우미 ─────────
const catName = k => (S.catalog.cats.find(c => c.k===k) || {n:k}).n;
const useById = id => S.uses.find(u => u.id===id);
const lvStars = n => "●".repeat(n) + "○".repeat(3-n);
function entriesAll(){ const out=[]; Object.values(S.logs).forEach(l => (l.entries||[]).forEach(e => out.push({...e, day:l.day}))); return out.sort((a,b)=>String(b.at).localeCompare(String(a.at))); }
function statsOf(id){ const es = entriesAll().filter(e => e.useId===id); const tries = es.filter(e=>e.did).length; const ok = es.filter(e=>e.did && e.ok===true).length; return {tries, ok, skips: es.filter(e=>!e.did).length}; }
let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},2600); }

// 오늘의 기술: 오늘 기록이 있으면 그 기술, 없으면 가장 덜 해본 기술(같으면 날짜로 순환)
function todayPick(){
  if(!S.uses.length) return null;
  const todays = (S.logs[TODAY]?.entries) || [];
  if(todays.length && S.pickOffset===0) return useById(todays[todays.length-1].useId) || S.uses[0];
  const seed = Math.floor(new Date(TODAY+"T00:00:00Z").getTime()/864e5);
  const ranked = [...S.uses].map((u,i) => ({u, n:statsOf(u.id).tries, r:(i + seed) % S.uses.length}))
    .sort((a,b) => a.n-b.n || a.r-b.r).map(x => x.u);
  return ranked[S.pickOffset % ranked.length];
}

// ───────── 카드 그리기 ─────────
const cut1 = (t, n) => { t = String(t||"").trim(); const m = /^(.+?[.!?。요다])(\s|$)/.exec(t); let x = m ? m[1] : t; return x.length > n ? x.slice(0, n-1) + "…" : x; };
// 장면 한눈에: 장면 → 단서 → 원리 → 결과를 만화 네 칸으로
function storyboard(u){
  return comic([["장면", [["you", "n", cut1(u.scene, 90)]]], ["제인이 본 것", [["me", "t", "(" + cut1(u.clue, 80) + ")"]]], ["원리", [["me", "w", cut1(u.principle, 90)]]], ["결과", [["you", u.level >= 3 ? "o" : "s", cut1(u.result, 80)]]]]);
}
const techOf = k => (S.catalog.techs||[]).find(t => t.k===k);
function fullCard(u){
  const st = statsOf(u.id), an = S.analysis;
  const lensBox = k => { const a = an[u.id+"__"+k], c = a && (S.catalog.concepts||{})[a.c];
    if(!c) return `<div class="lens"><div class="lbl">${LENS[k]} · 예정</div>${esc(u.lens[k])}</div>`;
    return `<div class="lens on"><div class="lbl">${LENS[k]} · ${esc(c.n)}</div>${a.s?`<p class="scn"><b>이 장면에서는</b> ${esc(a.s)}</p>`:""}<p>${esc(c.b)}</p><div class="src">이 장면의 주제: ${esc(a.title)}</div><div class="src">근거: ${esc(c.src)}</div></div>`; };
  return `<article class="card acc">
    <div class="top"><span class="no">${esc(u.id)}</span>${u.cat.map(k=>`<span class="pill acc">${esc(catName(k))}</span>`).join("")}<span class="pill ${VER[u.verified][1]}">${VER[u.verified][0]}</span></div>
    ${u.tech ? `<div class="thead2">${MART.icon(u.tech, "big")}<span><b>${esc(techOf(u.tech)?.n || "")}</b><small>${esc(techOf(u.tech)?.d || "")}</small></span></div>` : ""}
    <h3>${esc(u.name)}</h3>
    <div class="top"><span class="note">난이도</span><span class="lv" aria-label="난이도 ${u.level} / 3">${lvStars(u.level)}</span><span class="note">· 해본 횟수 ${st.tries} · 잘 된 횟수 ${st.ok}</span></div>
    <div><div class="lbl">장면</div><p>${esc(u.scene)}</p></div>
    <div class="box"><div class="lbl">단서</div>${esc(u.clue)}</div>
    <div class="box"><div class="lbl">원리</div>${esc(u.principle)}</div>
    <div class="box"><div class="lbl">결과</div>${esc(u.result)}</div>
    <div class="drill"><div class="lbl">훈련</div>${esc(u.drill)}</div>
    <div class="risk"><div class="lbl">위험 · 윤리</div>${esc(u.risk)}</div>
    ${(() => { const ls = allLessons().filter(l => l.techs[0]===u.tech || l.techs.includes(u.tech)).sort((a,b) => (a.techs[0]===u.tech?0:1) - (b.techs[0]===u.tech?0:1)).slice(0,4); return ls.length ? `<div><div class="lbl">대가에게 배우기</div><div class="chips">${ls.map(l => `<button class="chip" type="button" data-lesson="${esc(l.k)}">${esc(l.m.name.split(" · ")[0])} · ${esc(l.n)}</button>`).join("")}</div></div>` : ""; })()}
    ${techDeep(u.tech)}
    <div class="lenses">${["psy","phi","sci"].map(lensBox).join("")}</div>
    ${labFor(u)}
  </article>`;
}
function rowCard(u){
  const st = statsOf(u.id);
  return `<button class="row" type="button" data-open="${esc(u.id)}">
    <span class="no">${esc(u.id.slice(-2))}</span>${MART.icon(u.tech)}
    <span class="grow"><span class="t">${esc(u.name)}</span><span class="m">${u.cat.map(catName).map(esc).join(" · ")} · <span class="lv">${lvStars(u.level)}</span>${st.tries?` · ${st.tries}회`:""}</span></span>
    <span class="chev" aria-hidden="true">›</span></button>`;
}

function viewToday(){
  const u = todayPick();
  const box = $("#v-today");
  const banner = S.mode==="preview" ? `<div class="banner"><b>미리보기</b>저장소에 연결되지 않아 기록이 남지 않아요. claude.ai에서 로그인한 상태로 열면 저장돼요.</div>` : "";
  if(!u){ box.innerHTML = banner + `<p class="note">기술 카드가 아직 없어요.</p>`; return; }
  const todays = (S.logs[TODAY]?.entries)||[];
  const mine = todays.find(e => e.useId===u.id);
  const d = S.draft;
  let logUi;
  if(mine && S.pickOffset===0 && d.did===null){
    logUi = `<div class="card"><div class="done"><span class="pill ${mine.did?(mine.ok?"ok":"warn"):"bad"}">${mine.did?(mine.ok?"해봤어요 · 잘 됐어요":"해봤어요 · 아직"):"못했어요"}</span><span class="note">오늘 기록됨</span></div>${mine.memo?`<p class="memo">${esc(mine.memo)}</p>`:""}<div class="btnrow"><button class="btn ghost" type="button" id="reLog">기록 고치기</button><button class="btn ghost" type="button" id="nextPick">다른 기술도 하기</button></div></div>`;
  } else {
    logUi = `<div class="card">
      <div class="lbl">오늘 훈련, 해봤나요?</div>
      <div class="seg" role="group" aria-label="해봤는지"><button type="button" data-did="1" aria-pressed="${d.did===true}">해봤어요</button><button type="button" data-did="0" aria-pressed="${d.did===false}">못했어요</button></div>
      ${d.did===true?`<div class="lbl">어땠나요?</div><div class="seg" role="group" aria-label="결과"><button type="button" data-ok="1" aria-pressed="${d.ok===true}">잘 됐어요</button><button type="button" data-ok="0" aria-pressed="${d.ok===false}">아직이에요</button></div>`:""}
      ${d.did!==null?`<label class="lbl" for="memo">한 줄 메모 (무엇을 봤고, 무엇이 맞았나)</label><textarea id="memo" placeholder="예: 동료 책상 위 마라톤 메달 → 꾸준함을 중요하게 여길 것 같다. 점심에 물어보니 맞았음">${esc(d.memo)}</textarea>`:""}
      <div class="btnrow"><button class="btn okb" type="button" id="saveLog" ${d.did===null || (d.did===true && d.ok===null) ? "disabled":""}>기록하기</button><button class="btn ghost" type="button" id="nextPick">다른 기술로 바꾸기</button></div>
    </div>`;
  }
  const streak = calcStreak();
  box.innerHTML = banner + `
    <div class="top"><span class="note">${dayLabel(TODAY)}</span>${streak?`<span class="pill coin">${streak}일 연속</span>`:""}</div>
    <p class="lead">오늘의 기술 · ${esc(u.name)}</p>
    <div class="drill"><div class="lbl">오늘 할 훈련</div>${esc(u.drill)}</div>
    <div class="risk"><div class="lbl">지킬 것</div>${esc(u.risk)}</div>
    ${logUi}
    ${(() => { const ct = S.sc && courseToday(); return ct && ct.l ? `<h2 class="sec"><span class="n">${ct.no}/${ct.total}</span>오늘의 한 수 · ${esc(ct.l.m.name.split(" · ")[0])}</h2><article class="card"><h3>${esc(ct.l.n)}</h3>${comic(ct.l.cm)}<p>${esc(ct.l.what)}</p><button class="btn ghost" type="button" data-lesson="${esc(ct.l.k)}">수업 열기</button></article>` : ""; })()}
    ${reviewBox()}
    <h2 class="sec"><span class="n">${esc(u.id)}</span>장면과 원리</h2>
    ${fullCard(u)}`;
}
function calcStreak(){
  let n=0, day=TODAY;
  const did = dd => ((S.logs[dd]?.entries)||[]).some(e=>e.did);
  if(!did(day)) day = addDays(day,-1);
  while(did(day)){ n++; day = addDays(day,-1); }
  return n;
}

function viewEpisodes(){
  const seasons = Object.keys(S.catalog.seasons||{}).sort((a,b)=>a-b);
  if(!S.season) S.season = seasons[0] || "1";
  const titles = S.catalog.seasons[S.season] || [];
  const ids = titles.map((t,i) => S.season+"x"+String(i+1).padStart(2,"0"));
  const done = ids.filter(id => S.eps[id]);
  if(!S.ep || !ids.includes(S.ep)) S.ep = done[0] || null;
  const epCount = s => (S.catalog.seasons[s]||[]).filter((t,i)=>S.eps[s+"x"+String(i+1).padStart(2,"0")]).length;
  $("#v-episodes").innerHTML = `
    <div class="chips" role="group" aria-label="시즌">${seasons.map(s => `<button class="chip" type="button" data-season="${s}" aria-pressed="${S.season===s}">시즌 ${s} <span class="note">${epCount(s)}/${(S.catalog.seasons[s]||[]).length}</span></button>`).join("")}</div>

    <div class="eps">${titles.map((t,i) => { const id = ids[i]; const ep = S.eps[id]; const st = ep ? STATUS[ep.status] : null;
      return `<button class="ep${ep?" on":""}" type="button" data-ep="${id}" aria-pressed="${S.ep===id}" ${ep?"":"disabled"}><span class="mono">${id}</span><span>${esc(t)}</span>${st?`<span class="pill ${st[1]}">${st[0]}</span>`:`<span class="note">대기</span>`}</button>`; }).join("")}</div>
    ${S.ep && S.eps[S.ep] ? epBlock(S.eps[S.ep]) : ""}`;

function epBlock(ep){
  const list = S.uses.filter(u => u.id.startsWith(ep.id+"-")).sort((a,b)=>a.order-b.order);

    <div class="card acc" id="ep-${esc(ep.id)}">
      <p>${esc(ep.summary)}</p>
      <dl class="kv"><dt>방영</dt><dd>${esc(ep.aired)}</dd><dt>인물</dt><dd>${esc(ep.people)}</dd><dt>대조 자료</dt><dd>${esc(ep.source)}</dd><dt>기술</dt><dd>${list.length}장 · 대본 대조 ${list.filter(u=>u.verified==="script").length}장</dd></dl>
    </div>
    ${(() => { const cnt = {}; list.forEach(u => { if(u.tech) cnt[u.tech] = (cnt[u.tech]||0) + 1; }); const rows = Object.entries(cnt).sort((a,b) => b[1]-a[1]);
      return rows.length ? `<div class="card"><div class="lbl">이 회차에 나온 기술</div><div class="tirow">${rows.map(([k,v]) => `<span class="tib">${MART.icon(k)}<small>${esc((techOf(k)?.n||k).split(" · ")[0])} ${v}</small></span>`).join("")}</div>${bars([["장면 난이도", "장", [["●○○ 쉬움", list.filter(u => u.level===1).length], ["●●○ 보통", list.filter(u => u.level===2).length], ["●●● 어려움", list.filter(u => u.level===3).length]]]])}</div>` : ""; })()}
    <div class="stack" aria-label="장면 순서">${list.map(rowCard).join("")}</div>`;
}

// ───────── 화면: 도감 ─────────
const dexSeg = () => `<div class="seg" role="group" aria-label="보기"><button type="button" data-dexmode="map" aria-pressed="${S.dexMode==="map"}">기술 지도 · 훈련 순서</button><button type="button" data-dexmode="list" aria-pressed="${S.dexMode==="list"}">분류별 목록</button></div>`;
// 기술 지도: 같은 기술(tech)끼리 묶고 단계(stage) 순서로 — 위에서부터 따라 하면 쉬운 것부터
function viewMap(){
  const ST = S.catalog.stages || [], TS = S.catalog.techs || [];
  if(!TS.length || !S.uses.some(u => u.tech)){ $("#v-dex").innerHTML = `<p class="lead">기술 도감</p>${dexSeg()}<p class="note">기술 지도는 전체 데이터를 불러오면 보여요.</p>`; return; }
  const by = {}; S.uses.forEach(u => (by[u.tech] = by[u.tech] || []).push(u));
  const easy = (a,b) => a.level-b.level || a.id.localeCompare(b.id);
  Object.values(by).forEach(l => l.sort(easy));
  const tried = l => l.filter(u => statsOf(u.id).tries).length;
  const next = TS.find(t => (by[t.k]||[]).length && !tried(by[t.k]));
  const nu = next && by[next.k][0];
  const seasons = l => { const s = [...new Set(l.map(u => +u.id.split("x")[0]))].sort((a,b)=>a-b); return s.length > 1 ? `시즌 ${s[0]}~${s[s.length-1]}` : `시즌 ${s[0]}`; };
  const avg = l => Math.round(l.reduce((n,u) => n+u.level, 0) / l.length);
  let no = 0;
  $("#v-dex").innerHTML = `
    <p class="lead">기술 도감</p>${dexSeg()}
    <p class="note">151화에 흩어진 ${S.uses.length}장을 같은 기술 ${TS.length}개로 묶고, 쉬운 것부터 ${ST.length}단계로 줄 세웠어요. 위에서부터 한 기술씩, 기술 안에서는 난이도 낮은 장면부터 따라 하면 돼요.</p>
    ${nu ? `<article class="card acc"><div class="lbl">다음 연습 · ${esc(next.n)}</div><h3>${esc(nu.name)}</h3><div class="drill"><div class="lbl">훈련</div>${esc(nu.drill)}</div><button class="btn" type="button" data-open="${esc(nu.id)}">장면 열기</button></article>` : `<div class="card"><p class="note">모든 기술을 한 번 이상 해 봤어요. 이제 기술마다 난이도 ●●● 장면에 도전해 보세요.</p></div>`}
    <div class="card">${stairs(ST, TS, by, tried)}</div>
    ${ST.map((s, si) => { const ts = TS.filter(t => t.stage===s.k && (by[t.k]||[]).length); if(!ts.length) return "";
      const all = ts.flatMap(t => by[t.k]); const tr = tried(all);
      return `<h2 class="sec"><span class="n">${si+1}단계</span>${esc(s.n)}</h2><p class="note">${esc(s.d)} · ${all.length}장 중 ${tr}장 해 봄</p>
      ${ts.map(t => { const l = by[t.k]; no++; const tn = tried(l);
        return `<details class="cpt"><summary><span class="sti">${MART.icon(t.k)}${no}. ${esc(t.n)}</span><span class="n">${tn?`${tn}/`:""}${l.length}장 ›</span></summary><div class="body">
          <p>${esc(t.d)}.</p>
          ${bars([["난이도별 장면 수", "장", [["●○○", l.filter(u => u.level===1).length], ["●●○", l.filter(u => u.level===2).length], ["●●●", l.filter(u => u.level===3).length]]]])}<p class="note">${seasons(l)} · 평균 난이도 <span class="lv">${lvStars(avg(l))}</span> · 처음 나온 장면 ${esc(l.slice().sort((a,b)=>a.id.localeCompare(b.id))[0].id)}</p>
          <div class="drill"><div class="lbl">처음 해볼 훈련 · ${esc(l[0].name)}</div>${esc(l[0].drill)}</div>
          <div class="stack">${l.map(rowCard).join("")}</div></div></details>`; }).join("")}`; }).join("")}`;
}
// 8단계 계단 그림: 단마다 장면 수, 해 본 만큼 색이 참
function stairs(ST, TS, by, tried){
  const W = 320, H = 150, n = ST.length, sw = (W - 8) / n;
  return `<svg class="stair" viewBox="0 0 ${W} ${H}" role="img" aria-label="훈련 8단계">` + ST.map((s, i) => { const all = TS.filter(t => t.stage===s.k).flatMap(t => by[t.k]||[]), tr = tried(all), h = 26 + i * 13, x = 4 + i * sw, y = H - 22 - h, f = all.length ? tr / all.length : 0;
    return `<rect x="${x}" y="${y}" width="${sw-3}" height="${h}" rx="4" fill="var(--sunk)"/><rect x="${x}" y="${y + h * (1-f)}" width="${sw-3}" height="${h * f}" rx="4" fill="var(--accent)"/><text x="${x + (sw-3)/2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">${all.length}</text><text x="${x + (sw-3)/2}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="var(--ink,currentColor)">${i+1}</text>`; }).join("") + `</svg><p class="note" style="margin:2px 0 0">1단계 '눈 뜨기'부터 8단계 '함정 알아보기'까지. 숫자는 장면 수, 색은 해 본 만큼 차요.</p>`;
}

  const cats = S.catalog.cats;
  const list = S.uses.filter(u => S.dexCat==="all" || u.cat.includes(S.dexCat)).sort((a,b)=>a.id.localeCompare(b.id));
  const cur = cats.find(c => c.k===S.dexCat);
  $("#v-dex").innerHTML = `
    <p class="lead">기술 도감</p>${dexSeg()}
    <div class="chips" role="group" aria-label="분류">${[{k:"all",n:"전체"},...cats].map(c => `<button class="chip" type="button" data-cat="${c.k}" aria-pressed="${S.dexCat===c.k}">${esc(c.n)} ${c.k==="all"?S.uses.length:S.uses.filter(u=>u.cat.includes(c.k)).length}</button>`).join("")}</div>
    ${cur?`<p class="note">${esc(cur.d)}</p>`:""}
    <div class="stack">${list.length ? list.map(rowCard).join("") : `<p class="note">이 분류의 기술은 아직 나오지 않았어요.</p>`}</div>
    <h2 class="sec"><span class="n">용어</span>처음 보는 말</h2>
    <div class="card"><dl class="kv">${(S.catalog.glossary||[]).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`;
}

}

const RVI = [1,3,7,14,30];
function rvDue(){ SU.rv = SU.rv || {}; return Object.keys(SU.done).filter(k => lessonBy(k)).map(k => { const r = SU.rv[k] || {st:0, at: addDays(SU.done[k], RVI[0])}; return {k, r}; }).filter(x => x.r.at <= TODAY && x.r.st < RVI.length).sort((a,b) => a.r.at.localeCompare(b.r.at)); }
function quizFor(k){
  const l = lessonBy(k); if(!l) return null; const all = allLessons().filter(x => x.k!==k);
  const seed = (k + TODAY).split("").reduce((a,c) => a*31 + c.charCodeAt(0) >>> 0, 7);
  const pick = []; for(let i=0; pick.length<3 && i<50; i++){ const x = all[(seed + i*17) % all.length]; if(!pick.includes(x)) pick.push(x); }
  const opts = [l, ...pick].sort((a,b) => ((a.k+seed).length*7 + a.k.charCodeAt(1)) % 5 - ((b.k+seed).length*7 + b.k.charCodeAt(1)) % 5);

    const cls = es.some(e=>e.did) ? "on" : es.length ? "part" : ""; cal += `<div class="d ${cls}${day===TODAY?" today":""}" aria-label="${m}월 ${i}일 ${cls==="on"?"훈련함":cls==="part"?"못함 기록":""}">${i}</div>`; }

      ${ms.length ? `<h2 class="sec"><span class="n">${ms.reduce((n,r) => n+r[1], 0)}/${ms.reduce((n,r) => n+r[2], 0)}</span>대가 수업 진도</h2><div class="card">${bars([["해 본 수업", "개", ms.map(r => [r[0] + " (" + r[2] + "개 중)", r[1]]), Math.max(...ms.map(r => r[2]))]])}</div>` : ""}`; })()}
    <h2 class="sec"><span class="n">${m}월</span>훈련 달력</h2>
    <div class="cal">${cal}</div>
    <p class="note">초록은 훈련한 날, 금색은 '못했어요'만 기록한 날이에요.</p>

    <h2 class="sec"><span class="n">7일</span>주간 숙련도 리포트</h2>
    <div class="card">
      ${wTries.length ? `<p>지난 7일 동안 <b>${new Set(wTries.map(e=>e.day)).size}일</b> 훈련했고 <b>${wTries.length}번</b> 시도해서 <b>${wOk.length}번</b> 잘 됐어요.</p>
      ${topCat?`<p>가장 많이 연습한 분류는 <b>${esc(catName(topCat[0]))}</b>이에요.</p>`:""}` : `<p>지난 7일 기록이 아직 없어요. '오늘' 탭에서 훈련 하나를 해보고 기록하면 여기에 쌓여요.</p>`}

// ───────── 렌더와 이동 ─────────
const VIEWS = ["today","episodes","dex","lens","log"];
const DRAW = {today:viewToday, episodes:viewEpisodes, dex:viewDex, lens:viewLens, log:viewLog};
function render(){ DRAW[S.view](); }
function show(v){
  if(!VIEWS.includes(v)) v = "today";
  S.view = v;
  VIEWS.forEach(x => { $("#v-"+x).hidden = x!==v; });
  document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.v===v ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  render(); window.scrollTo(0,0);
}
function go(v){ try{ history.replaceState(null, "", "#"+v); }catch(_){} show(v); }
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if(!b) return; go(b.dataset.v); });
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
document.addEventListener("toggle", e => { const d = e.target; if(!d.classList) return;
  if(d.classList.contains("xp")){ const id = d.id.slice(3), x = labBy(id); if(d.open && x){ const b = d.querySelector(".body"); if(!b.innerHTML) b.innerHTML = expBody(x) + `<button class="btn ${LU.read[id]?"ghost":"okb"}" type="button" data-labread="${esc(id)}">${LU.read[id]?"읽음 ✓":"읽었어요"}</button>`; S.openLab = id; if(!LU.read[id]){ LU.read[id] = TODAY; saveLU(); } } else if(S.openLab===id) S.openLab = null; return; }
  if(!d.classList.contains("les")) return; const k = d.id.slice(4); if(d.open) S.openLesson = k; else if(S.openLesson===k) S.openLesson = null; }, true);

document.addEventListener("click", e => {
  const t = e.target;
  if(t.closest("[data-close]")){ closeSheet(); return; }
  const op = t.closest("[data-open]"); if(op){ openCard(op.dataset.open); return; }
  const td = t.closest("[data-today]"); if(td){ setToday(td.dataset.today); closeSheet(); go("today"); return; }
  const sn = t.closest("[data-season]"); if(sn){ S.season = sn.dataset.season; S.ep = null; viewEpisodes(); return; }
  const ep = t.closest("[data-ep]"); if(ep){ S.ep = ep.dataset.ep; viewEpisodes(); const el = document.getElementById("ep-"+ep.dataset.ep); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const dm = t.closest("[data-dexmode]"); if(dm){ S.dexMode = dm.dataset.dexmode; viewDex(); return; }
  const c = t.closest("[data-cat]"); if(c){ S.dexCat = c.dataset.cat; viewDex(); return; }
  const xl = t.closest("[data-lab]"); if(xl){ goLab(xl.dataset.lab); return; }
  const xf = t.closest("[data-labf]"); if(xf){ S.labF = xf.dataset.labf; S.openLab = null; viewLens(); return; }
  const xr = t.closest("[data-labread]"); if(xr){ const k = xr.dataset.labread; if(LU.read[k]) delete LU.read[k]; else LU.read[k] = TODAY; saveLU(); viewLens(); return; }
  const lm = t.closest("[data-lensmode]"); if(lm){ S.lensMode = lm.dataset.lensmode; S.master = null; viewLens(); return; }
  const ms = t.closest("[data-master]"); if(ms){ const k = ms.dataset.master || null;
    if(!k){ if(history.state && history.state.vfmMaster) history.back(); else { S.master = null; viewLens(); window.scrollTo(0, S.masterY||0); } return; }
    S.masterY = window.scrollY; S.master = k; pushLayer("vfmMaster"); viewLens(); window.scrollTo(0,0); return; }
  const mcb = t.closest("[data-mcourse]"); if(mcb){ S.mcourse = mcb.dataset.mcourse || null; S.master = null; S.lensMode = "school"; if(S.view==="lens") viewLens(); else go("lens"); window.scrollTo(0,0); return; }
  const rp = t.closest("[data-rvpick]"); if(rp){ const [k, pick] = rp.dataset.rvpick.split("|"); S.rvAns = {k, pick}; viewToday(); return; }
  const rn = t.closest("[data-rvnext]"); if(rn){ const [k, ok] = rn.dataset.rvnext.split("|"); SU.rv = SU.rv || {}; const r = SU.rv[k] || {st:0}; if(ok==="1"){ r.st++; r.at = r.st < RVI.length ? addDays(TODAY, RVI[r.st]) : "9999-12-31"; } else { r.at = addDays(TODAY, 1); } SU.rv[k] = r; saveSU(); S.rvAns = null; toast(ok==="1" ? "좋아요! 다음 복습은 더 나중에" : "내일 다시 만나요"); viewToday(); return; }
  const ls = t.closest("[data-lesson]"); if(ls){ goLesson(ls.dataset.lesson); return; }
  const ld = t.closest("[data-ldone]"); if(ld){ const k = ld.dataset.ldone; if(SU.done[k]) delete SU.done[k]; else { SU.done[k] = TODAY; toast("기록했어요"); } saveSU(); S.openLesson = k; if(S.view==="lens") viewLens(); else render(); return; }
  const l = t.closest("[data-lens]"); if(l){ S.lens = l.dataset.lens; viewLens(); return; }
  const did = t.closest("[data-did]"); if(did){ keepMemo(); S.draft.did = did.dataset.did==="1"; if(!S.draft.did) S.draft.ok = null; viewToday(); return; }
  const ok = t.closest("[data-ok]"); if(ok){ keepMemo(); S.draft.ok = ok.dataset.ok==="1"; viewToday(); return; }
  if(t.closest("#nextPick")){ S.pickOffset++; S.draft={did:null,ok:null,memo:""}; viewToday(); return; }
  if(t.closest("#reLog")){ const u = todayPick(); const mine = ((S.logs[TODAY]?.entries)||[]).find(x=>x.useId===u.id); S.draft = {did:mine.did, ok:mine.ok ?? null, memo:mine.memo||""}; viewToday(); return; }
  if(t.closest("#saveLog")){ saveLog(); return; }
  const dlb = t.closest("[data-dl]"); if(dlb){ download(dlb.dataset.dl); return; }
  if(t.closest("#copyLogs")){ copyLogs(); return; }
});
function keepMemo(){ const m = $("#memo"); if(m) S.draft.memo = m.value; }
function setToday(id){
  const ranked = (() => { const keep = S.pickOffset; const out=[]; for(let i=0;i<S.uses.length;i++){ S.pickOffset=i+1; out.push(todayPick()); } S.pickOffset=keep; return out; })();
  const idx = ranked.findIndex(u => u && u.id===id);
  S.pickOffset = idx>=0 ? idx+1 : 0; S.draft={did:null,ok:null,memo:""};
}

// ───────── 기록 저장 (하루 한 문서, 한 번에 하나씩) ─────────
let saving = Promise.resolve();
async function saveLog(){
  keepMemo();
  const u = todayPick(); if(!u) return;
  const entry = {useId:u.id, did:S.draft.did, ok:S.draft.did ? S.draft.ok : null, memo:S.draft.memo.trim().slice(0,500), at:new Date().toISOString()};
  const cur = S.logs[TODAY] || {day:TODAY, entries:[]};
  const next = {day:TODAY, entries:[...(cur.entries||[]).filter(e=>e.useId!==u.id), entry], updatedAt:entry.at};
  S.logs[TODAY] = next; S.draft = {did:null,ok:null,memo:""}; S.pickOffset = 0;
  viewToday();
  if(S.mode!=="live" || !S.canWrite){ toast(S.mode==="live" ? "이 화면에서는 기록을 저장할 수 없어요" : "미리보기라 저장되지 않아요"); return; }
  saving = saving.then(() => S.db.collection("logs").doc(TODAY).set(next))
    .then(() => toast("기록했어요"))
    .catch(e => { if(e && e.code==="invalid_argument"){ S.canWrite=false; } toast("저장하지 못했어요" + (e && e.code ? " ("+e.code+")" : "")); });
}

// ───────── 내보내기 ─────────
const csvCell = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
const toCSV = rows => "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
function logRows(){ return [["날짜","기술ID","기술이름","해봤나","결과","메모","기록시각"], ...entriesAll().slice().reverse().map(e => [e.day, e.useId, useById(e.useId)?.name||"", e.did?"해봄":"못함", e.did?(e.ok?"잘 됨":"아직"):"", e.memo||"", e.at])]; }
function cardRows(){ return [["use_id","순서","분류","난이도","대조","기술이름","장면요약","단서","원리","결과","훈련","위험윤리","심리학","철학","과학"], ...S.uses.slice().sort((a,b)=>a.id.localeCompare(b.id)).map(u => [u.id,u.order,u.cat.map(catName).join("/"),u.level,VER[u.verified][0],u.name,u.scene,u.clue,u.principle,u.result,u.drill,u.risk,...["psy","phi","sci"].map(k => { const a = S.analysis[u.id+"__"+k], c = a && (S.catalog.concepts||{})[a.c]; return c ? c.n+" — "+(a.s ? a.s+" / " : "")+c.b : u.lens[k]; })])]; }
let DL = null;
function updateDlButtons(){ document.querySelectorAll("[data-dl]").forEach(b => b.disabled = false); return; const n=$("#dlNote"); if(n && !DL && S.mode!=="loading") n.textContent = "이 화면에서는 파일 받기를 쓸 수 없어요. '복사' 후 시트에 붙여 넣으세요."; }
async function download(kind){
  const rows = kind==="logs" ? logRows() : kind==="school" ? schoolRows() : cardRows();
  const fname = kind==="logs" ? `멘탈리스트_훈련기록_${TODAY}.csv` : kind==="school" ? "멘탈리스트_대가수업.csv" : "멘탈리스트_기술카드.csv";
  if(!DL){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([toCSV(rows)], {type:"text/csv"})); a.download = fname; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return; }
  try{ await DL.save({filename: fname, data: toCSV(rows)}); toast("받기를 시작했어요"); }
  catch(e){ toast("받지 않았어요" + (e && e.code ? " ("+e.code+")" : "")); }
}
async function copyLogs(){
  const tsv = logRows().map(r => r.map(v => String(v ?? "").replace(/[\t\n\r]/g," ")).join("\t")).join("\n");
  try{ await navigator.clipboard.writeText(tsv); toast("복사했어요. 시트에 붙여 넣으면 칸이 나뉘어요"); } catch(_){ toast("복사가 막혀 있어요"); }
}

// ───────── 불러오기 ─────────
function usePreview(){
  S.mode = "preview";
  S.catalog = SEED.catalog; S.eps = {[SEED.episode.id]:SEED.episode}; S.uses = SEED.uses.slice();
  $("#edchip").innerHTML = `<b>미리보기</b>1x01 · ${S.uses.length}장`;
  render(); updateDlButtons();
}
function setLive(){
  S.mode = "live";
  $("#edchip").innerHTML = `<b>${Object.keys(S.catalog.seasons||{}).length}시즌</b>${Object.keys(S.eps).length}화 · ${S.uses.length}장`;
}
async function boot(){
  fetch("../data/mental/lab.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : Promise.reject()).then(j => { S.lab = j; const m = /^xp-([\w-]+)$/.exec(location.hash.slice(1)); if(m) goLab(m[1]); else if(S.view==="lens" && S.lensMode==="lab") viewLens(); }).catch(() => { S.lab = false; });
  fetch("../data/mental/school.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : Promise.reject()).then(j => { S.sc = j; const m = /^les-(\w+)$/.exec(location.hash.slice(1)); if(m) goLesson(m[1]); else if(!$("#sheetHost").innerHTML && !$("#memo")) render(); }).catch(() => { S.sc = false; if(S.view==="lens") render(); });
  render();
  const cap = window.claude && typeof window.claude.use === "function" ? window.claude : null;
  if(!cap){ usePreview(); return; }
  cap.use("downloads").then(d => { DL = d; updateDlButtons(); }).catch(()=>{});
  const timer = setTimeout(() => { if(S.mode==="loading") usePreview(); }, 10000);
  let db = null;
  try{ db = await cap.use("db"); }catch(_){}
  if(!db){ clearTimeout(timer); usePreview(); return; }
  S.db = db;
  try{
    const user = await cap.use("user").catch(()=>null);
    if(user){ const w = await Promise.resolve(user.can ? user.can("data.write") : null).catch(()=>null); S.canWrite = w !== false; } else S.canWrite = true;
    const [meta, eps, uses] = await Promise.all([db.collection("meta").doc("catalog").get(), db.collection("eps").get(), db.collection("uses").get()]);
    clearTimeout(timer);
    if(!uses.size){ usePreview(); return; }
    if(meta.exists) S.catalog = meta.data();
    S.eps = {}; eps.docs.forEach(d => S.eps[d.id] = {id:d.id, ...d.data()});
    S.uses = uses.docs.map(d => ({id:d.id, ...d.data()}));
    setLive(); render();
  }catch(e){ clearTimeout(timer); usePreview(); return; }
  db.collection("analysis").onSnapshot(snap => { S.analysis = {}; snap.docs.forEach(d => S.analysis[d.id] = d.data()); if(!$("#sheetHost").innerHTML) render(); }, () => {});
  db.collection("logs").orderBy("day","desc").limit(400).onSnapshot(snap => {
    const fresh = {}; snap.docs.forEach(d => fresh[d.id] = d.data());
    S.logs = fresh; if(!$("#sheetHost").innerHTML && !$("#memo")) render();
  }, () => {});
}
window.vfmApp = { back(){ if($("#sheetHost").innerHTML){ closeSheet(); return true; } if(S.view==="lens" && S.master){ S.master = null; viewLens(); return true; } if(S.view!=="today"){ go("today"); return true; } return false; }, go: x => go(String(x||"").replace(/^#/,"")), route: () => render(), top: () => go("today") };
show(location.hash.slice(1));
boot();
})();
</script>
