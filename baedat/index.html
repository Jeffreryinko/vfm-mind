<!DOCTYPE html>
<html lang="ko" class="ap ap-baedat">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.VFM_APP="baedat";window.VFM_SHIM={fileCollections:{}};</script>
<script src="../assets/claude-shim.js"></script>
<link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#F2F2F7"><link rel="apple-touch-icon" href="../assets/icon-192.png">
<title>배댓 자판기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/apple.css">
<style>
/* Layout: 자판기 공통 애플 iOS 방식 — 회색 바탕 + 흰 카드, 0.5px 구분선, 반투명 아래 탭, 굵은 큰 제목. 배댓 강조색은 빨강. 영상 탭은 큰 썸네일 카드 + 배댓 10개 */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Pretendard Variable",Pretendard,system-ui,sans-serif;
  --bg:#F2F2F7; --surface:#FFFFFF; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --ink:#000000; --muted:#6E6E73; --faint:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29); --line:#E5E5EA;
  --tint:#FF3B30; --tint-t:#D70015; --tint-soft:rgba(255,59,48,.12);
  --orange:#FF9500; --orange-t:#C24E00; --orange-soft:rgba(255,149,0,.15);
  --green-t:#248A3D;
  --bar:rgba(249,249,249,.86);
  --t1:#FF3B30; --t2:#30B0C7; --t3:#007AFF; --t4:#FF9500; --t5:#5856D6; --t6:#FF2D55; --t7:#34C759; --t8:#8E8E93; --t9:#AF52DE; --t10:#A2845E;
  --r:14px; --nav-h:58px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --ink:#FFFFFF; --muted:#98989F; --faint:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6); --line:#38383A;
  --tint:#FF453A; --tint-t:#FF6961; --tint-soft:rgba(255,69,58,.18);
  --orange:#FF9F0A; --orange-t:#FFB340; --orange-soft:rgba(255,159,10,.18);
  --green-t:#30D158;
  --bar:rgba(22,22,24,.84);
  --t1:#FF453A; --t2:#40CBE0; --t3:#0A84FF; --t4:#FF9F0A; --t5:#5E5CE6; --t6:#FF375F; --t7:#30D158; --t8:#98989F; --t9:#BF5AF2; --t10:#AC8E68;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --ink:#FFFFFF; --muted:#98989F; --faint:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6); --line:#38383A;
  --tint:#FF453A; --tint-t:#FF6961; --tint-soft:rgba(255,69,58,.18);
  --orange:#FF9F0A; --orange-t:#FFB340; --orange-soft:rgba(255,159,10,.18);
  --green-t:#30D158;
  --bar:rgba(22,22,24,.84);
  --t1:#FF453A; --t2:#40CBE0; --t3:#0A84FF; --t4:#FF9F0A; --t5:#5E5CE6; --t6:#FF375F; --t7:#30D158; --t8:#98989F; --t9:#BF5AF2; --t10:#AC8E68;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--tint-t);text-decoration:none}
img{max-width:100%}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
::selection{background:var(--tint-soft)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:relative;z-index:1;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1;display:flex;align-items:center;gap:8px;margin:0}
.mark{width:26px;height:26px;flex:none}
.mark .b{fill:var(--tint)} .mark .s{fill:#fff}
.hspace{flex:1}
.edchip{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
.edchip b{display:block;color:var(--ink);font-weight:600;font-size:13px}

main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
section.view{display:flex;flex-direction:column;gap:14px;padding-block:14px}
h2.sec{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:10px 0 -2px;display:flex;align-items:baseline;gap:8px}
h2.sec .n{font-size:13px;font-weight:600;color:var(--tint-t)}
.lead{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.15;letter-spacing:-.03em;margin:0;text-wrap:balance}
h3{margin:0}
p{margin:0}
.note{font-size:12.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--tint);color:#fff;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap;background:var(--fill);color:var(--muted)}
.pill.acc{background:var(--tint-soft);color:var(--tint-t)}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}

.card{background:var(--surface);border-radius:var(--r);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--orange-soft)}
.banner b{color:var(--orange-t);margin-right:6px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{font-size:12px;color:var(--muted)}

/* 썸네일: 사이트 파일을 직접 받아 붙임 */
.th{position:relative;display:block;aspect-ratio:16/9;background:var(--fill);overflow:hidden}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s}
.th img.on{opacity:1}
.th .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint)}
.th .ph::before{content:"";border-left:18px solid currentColor;border-top:11px solid transparent;border-bottom:11px solid transparent}
.th .rk{position:absolute;left:8px;top:8px;font-size:13px;font-weight:700;background:var(--tint);color:#fff;border-radius:7px;padding:1px 8px;font-variant-numeric:tabular-nums}
.th .dur{position:absolute;right:8px;bottom:8px;font-size:12px;font-weight:600;background:rgba(0,0,0,.75);color:#fff;border-radius:5px;padding:0 6px;font-variant-numeric:tabular-nums}
.th .sh{position:absolute;left:8px;bottom:8px;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.75);color:#fff;border-radius:5px;padding:0 6px}

/* 큰 화면: 영상 카드를 왼쪽 영상 · 오른쪽 배댓으로 */
@media (min-width:900px){
  .vcard{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
  .vcard .vleft{position:sticky;top:12px}
  .vcard .vright{border-left:.5px solid var(--sep);max-height:calc((min(1180px,100vw) - 48px) * .6 * 9 / 16 + 220px);overflow-y:auto}
  .vcard .vright .blist{border-top:0}
  .cmt .src{grid-template-columns:240px 1fr}
  .stack.vlist{gap:20px}
}
/* 휴대폰: 영상 카드를 화면 끝까지 */
@media (max-width:600px){ .vcard{margin-left:-16px;margin-right:-16px;border-radius:0} }
.hide-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hide-bar .chip.off{text-decoration:line-through;opacity:.75}
.hide-bar .chip.off[aria-pressed="true"]{background:var(--ink);color:var(--bg);text-decoration:line-through}
/* 세로 영상(쇼츠): 9:16으로, 화면 높이를 넘지 않게 가운데 */
.media{background:#000;display:flex;justify-content:center}
.media > .player{width:100%}
.media.v .th,.media.v .player{aspect-ratio:9/16;width:auto;height:min(78vh,760px);max-width:100%}
.media.v .play{width:auto}
/* 바로 재생 */
.play{display:block;width:100%;border:0;padding:0;background:none;position:relative;cursor:pointer}
.play .pbtn{position:absolute;left:50%;top:50%;width:64px;height:44px;margin:-22px 0 0 -32px;border-radius:12px;background:rgba(255,0,0,.92);display:grid;place-items:center}
.play .pbtn::before{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.player{position:relative;aspect-ratio:16/9;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.perr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;color:#fff;font-size:14px}
.perr .btn{text-decoration:none}
.login{display:flex;align-items:center;gap:12px}
.login p{flex:1;font-size:14px}
/* 영상 카드 */
.vcard{background:var(--surface);border-radius:18px;overflow:hidden;scroll-margin-top:72px}
.vcard>.th{border-radius:0}
.vbody{padding:12px 16px 12px;display:flex;flex-direction:column;gap:6px}
.vt{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.3;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.vm{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px}
.vm b{color:var(--ink);font-weight:600}
.vd{font-size:14px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vsum{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);background:var(--fill2);border-radius:10px;padding:8px 10px}
.vsum b{color:var(--ink);font-weight:600}
.vsum span{display:inline-flex;align-items:center;gap:4px}
.vact{display:flex;gap:8px;margin-top:2px}
.btn{border:0;background:var(--tint);color:#fff;border-radius:10px;padding:8px 14px;font-size:14.5px;font-weight:600;text-align:center;display:inline-block}
.btn.ghost{background:var(--fill);color:var(--tint-t)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:130px}

/* 배댓 목록 (카드 안) */
.blist{list-style:none;margin:0;padding:0 16px 6px;border-top:.5px solid var(--sep)}
.blist>li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:11px 0;border-bottom:.5px solid var(--sep)}
.blist>li:last-child{border-bottom:0}
.br{font-family:var(--display);font-weight:700;font-size:15px;color:var(--tint-t);text-align:center;font-variant-numeric:tabular-nums;padding-top:1px}
.bmain{min-width:0;display:flex;flex-direction:column;gap:5px}
.bt{font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;border:0;background:none;padding:0;text-align:left;width:100%}
.bt.open{display:block;-webkit-line-clamp:unset}
.bm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bm .tg{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500}
.heart{border:0;background:var(--fill);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;color:var(--muted);margin-left:auto}
.heart[aria-pressed="true"]{background:var(--orange-soft);color:var(--orange-t)}
.bmore{display:block;width:100%;border:0;background:none;color:var(--tint-t);font-size:14px;font-weight:600;padding:12px 16px 14px;border-top:.5px solid var(--sep)}

/* 배댓 단독 카드 (이번 달 · 배댓 탭) */
.cmt{background:var(--surface);border-radius:var(--r);overflow:hidden}
.cmt .src{display:grid;grid-template-columns:148px 1fr;gap:12px;align-items:center;padding:10px 12px;border-bottom:.5px solid var(--sep);border-left:0;border-right:0;border-top:0;background:none;width:100%;text-align:left}
.cmt .src .th{border-radius:9px}
.cmt .src .st{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmt .src .sm{font-size:12px;color:var(--muted)}
.cmt .cb{padding:11px 14px 12px;display:flex;flex-direction:column;gap:6px}
@media (max-width:420px){.cmt .src{grid-template-columns:120px 1fr}}

/* 분석 */
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:88px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.btrack{height:12px;border-radius:999px;background:var(--fill);overflow:hidden}
.btrack i{display:block;height:100%;border-radius:999px}
.brow .num{font-size:13px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.stackbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--fill)}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tbl{overflow-x:auto;border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:480px}
th,td{text-align:left;padding:9px 12px;border-bottom:.5px solid var(--sep);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.kws{display:flex;flex-wrap:wrap;gap:6px}
textarea{width:100%;min-height:60px;border:0;border-radius:10px;background:var(--fill);padding:9px 11px;font-size:15px;resize:vertical}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
dl.kv dt{color:var(--muted);white-space:nowrap}
dl.kv dd{margin:0}
.ph-line{height:10px;border-radius:5px;background:var(--fill)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:#8E8E93}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--tint);font-weight:600}
/* 명댓글 감상: 장면 → 한 줄 → 다시 보기 */
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg2.s3{grid-template-columns:repeat(3,1fr)}
.seg2 button{border:0;background:none;border-radius:8px;padding:7px 0;font-size:14px;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lgrid{display:grid;gap:16px}
@media (min-width:900px){.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mo{background:var(--surface);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:72px}
@media (max-width:600px){.mo{margin-left:-16px;margin-right:-16px;border-radius:0}}
.mo.pick{outline:2px solid var(--tint);outline-offset:-2px}
.mo .mb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.mo .mtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mo .mt{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mo .setup{font-size:15.5px;line-height:1.6}
.mo .hook{font-size:14px;color:var(--tint-t);font-weight:600}
.reveal{border:1.5px dashed var(--tint);background:var(--tint-soft);color:var(--tint-t);border-radius:14px;padding:16px;font-size:16px;font-weight:700;width:100%}
.line1{font-family:var(--display);font-size:clamp(21px,5.6vw,27px);font-weight:700;line-height:1.38;letter-spacing:-.02em;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;border-left:4px solid var(--tint);padding:2px 0 2px 12px}
.line1.long{font-size:clamp(18px,4.6vw,21px)}
.lmeta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.anat{background:var(--fill2);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.6}
.anat .k{font-size:12px;font-weight:700;color:var(--tint-t);letter-spacing:0}
.more{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.more li{font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:12px;border-left:2px solid var(--line)}
.more li.rp{border-left-color:var(--tint)}
.more li small{display:block;font-size:12px;color:var(--muted)}
.mine textarea{width:100%;min-height:64px;border:0;border-radius:10px;background:var(--fill2);padding:10px;font-size:15px;resize:vertical}
.pickbar{display:flex;gap:8px;align-items:center}
.pickbar .btn{flex:none}
.edc{margin-bottom:4px}
.msel{display:flex;gap:6px;align-items:center}
.msel select{flex:1;font:inherit;font-size:15px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:inherit;min-width:0}
.msel .chip[disabled]{opacity:.35}
.rw{transition:opacity .3s ease,max-height .35s ease;max-height:1200px;overflow:hidden}
.rw.gone{opacity:0;max-height:0;padding-top:0;padding-bottom:0;border-bottom-width:0}
@media (prefers-reduced-motion:reduce){.rw{transition:none}}
.cmt.open .media{border-radius:0}
.cmt.open .cb{display:flex;flex-direction:column;gap:8px}
.cpt{display:flex;flex-direction:column;gap:2px}
.cpt b{font-size:14px;line-height:1.35}
.b5{display:flex;flex-direction:column;gap:0;margin-top:4px;border-top:.5px solid var(--sep)}
.b5 .lbl{font-size:12px;font-weight:700;color:var(--muted);padding:8px 0 2px}
.b5i{padding:8px 0;border-bottom:.5px solid var(--sep)}
.b5i:last-child{border-bottom:0}
.b5i p{margin:0 0 2px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.b5i.me p{font-weight:700}
.rcard .media.pl{max-height:none;aspect-ratio:auto}
.rcard .media.pl .player{aspect-ratio:16/9;height:auto}
.rcard .media.pl.v .player,.cmt.open .media.v .player{aspect-ratio:9/16;width:auto;height:min(62vh,560px);margin:0 auto}

const YTL = `onload="try{this.contentWindow.postMessage(JSON.stringify({event:'listening',id:1,channel:'widget'}),'*')}catch(_){}"`;
const playerHtml = id => `<div class="player" data-player="${esc(id)}"><iframe ${YTL} src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0&${YTQ()}" title="유튜브 플레이어" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;

  const t = c[2].replace(/\s+/g, " ").toLowerCase(); const f = new Set();

}

  Object.values(S.RW).forEach(R => { if(!R || !R.comments) return; R.comments.forEach(c => { const r = LGU.rate[c[1]]; if(!r) return;
    const w = r===3 ? 1 : r===2 ? .5 : 1, bag = r===1 ? neg : pos; r===1 ? nn++ : np += w;

const TODAY_N = 30, TKEY = "vfm:baedat:today";
const kday = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
const dayNo = () => Math.floor((Date.now() + 9*3600e3) / 864e5);
let TD = null; try{ TD = JSON.parse(localStorage.getItem(TKEY) || "null"); }catch(_){}
function saveTD(){ try{ localStorage.setItem(TKEY, JSON.stringify(TD)); }catch(_){} }
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const shuf = (a, r) => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const chOf = v => v[7] || v[1];
async function buildToday(round){
  const raws = S.LG.raws || [], r = rng(dayNo() * 31 + round);
  const live = raws.filter(x => x.live).map(x => x.month);
  const older = shuf(raws.map(x => x.month).filter(m => !live.includes(m)), r).slice(0, 4 + round * 2);
  const Rs = (await Promise.all([...new Set([...live, ...older])].map(loadRawP))).filter(Boolean);
  const have = new Set((TD && TD.date===kday() ? TD.ids : []).map(x => x[0]));
  const items = [];
  Rs.forEach(R => { const by = {}; R.comments.forEach(c => (by[c[0]] = by[c[0]] || []).push(c));
    Object.entries(R.videos).forEach(([vid, v]) => { const cs = (by[vid] || []).slice(0, 5); if(!cs.length || LGU.seen[vid] || LGU.block[chOf(v)] || have.has(vid) || cs.every(c => LGU.rate[c[1]])) return; items.push({vid, m:R.month, v, cs}); }); });
  const now = Date.now(), isNew = x => (now - Date.parse(x.v[2])) / 864e5 <= 7;
  const M = tasteModel(), useT = M.n >= 10 && M.np && M.nn;
  const nw = items.filter(isNew).sort((a,b) => b.cs[0][3] - a.cs[0][3]);
  let old = shuf(items.filter(x => !isNew(x)), r);
  if(useT){ const sc = new Map(old.map(x => [x, x.cs.reduce((s,c) => s + tasteScore(M, c, {[x.vid]:x.v}), 0) / x.cs.length + r() * 3])); old.sort((a,b) => sc.get(b) - sc.get(a)); }
  const pool = [...nw.slice(0, 12), ...old, ...nw.slice(12)], out = [], perCh = {}, perCat = {};
  let fresh = 0;
  const known = ch => !!LGU.chs[ch];
  const ok = x => { const ch = chOf(x.v); return (perCh[ch]||0) < 2 && (perCat[x.v[4]]||0) < TODAY_N/2 && !(out.length && chOf(out[out.length-1].v)===ch); };
  while(out.length < TODAY_N && pool.length){
    const need = fresh < 6 && TODAY_N - out.length <= 6 - fresh;
    let i = pool.findIndex(x => ok(x) && (!need || !known(chOf(x.v))));
    if(i < 0 && need){ fresh = 6; continue; }
    if(i < 0) i = pool.findIndex(x => !(out.length && chOf(out[out.length-1].v)===chOf(x.v)));
    if(i < 0) break;
    const x = pool.splice(i, 1)[0], ch = chOf(x.v); out.push(x);
    perCh[ch] = (perCh[ch]||0) + 1; perCat[x.v[4]] = (perCat[x.v[4]]||0) + 1; if(!known(ch)) fresh++;
  }
  return out.map(x => [x.vid, x.m]);
}

    if(!TD || TD.date!==kday()){ TD = {date:kday(), ids:await buildToday(0), i:0, round:0}; saveTD(); }
    await Promise.all([...new Set(TD.ids.map(x => x[1]))].map(loadRawP));
  } finally { tdBusy = false; }
  S.tdReady = kday(); if(S.view==="today") draw();
}

let writing = Promise.resolve();
function persist(m){
  if(S.mode!=="live" || !S.canWrite) return;
  const doc = {month:m, items:savedOf(m), updatedAt:new Date().toISOString()};
  writing = writing.then(() => S.db.collection("saved").doc(m).set(doc)).catch(e => { if(e?.code==="invalid_argument") S.canWrite=false; toast("저장하지 못했어요" + (e?.code?` (${e.code})`:"")); });
}
function toggleSave(cid, vid){
  const m = S.month; const items = {...savedOf(m)};
  if(items[cid]) delete items[cid]; else items[cid] = {vid, memo:"", at:new Date().toISOString()};
  S.saved[m] = {month:m, items};
  if(S.mode!=="live") toast("미리보기라 저장되지 않아요"); else if(!S.canWrite) toast("이 화면에서는 저장할 수 없어요");

  document.querySelectorAll(`[data-save="${CSS.escape(cid)}"]`).forEach(b => { const on=!!items[cid]; b.setAttribute("aria-pressed", String(on)); b.textContent = on?"저장됨":"저장"; });

  const pl = t.closest("[data-play]"); if(pl){ play(pl.dataset.play, pl); return; }
  const sv = t.closest("[data-save]"); if(sv){ toggleSave(sv.dataset.save, sv.dataset.vid); return; }
  const bt = t.closest("[data-bt]"); if(bt){ const k = bt.dataset.bt; S.open.has(k) ? S.open.delete(k) : S.open.add(k); document.querySelectorAll(`[data-bt="${CSS.escape(k)}"]`).forEach(x => x.classList.toggle("open", S.open.has(k))); return; }
  const gt = t.closest("[data-goto]"); if(gt){ if(gt.dataset.cid){ S.cplay = gt.dataset.cid; playing = null; const keep = window.scrollY; draw(); window.scrollTo(0, keep); } else { const vv = (ed()?.videos||[]).find(x => x.id===gt.dataset.goto); openPlayer(gt.dataset.goto, 0, vv?.ar); } return; }
  if(t.closest("[data-cclose]")){ S.cplay = null; const keep = window.scrollY; draw(); window.scrollTo(0, keep); return; }
  if(false){ (window.requestAnimationFrame || (f => setTimeout(f, 16)))(() => { const el = document.getElementById("vc-"+gt.dataset.goto); if(el) el.scrollIntoView({block:"start"}); }); return; }
  const mb = t.closest("[data-month]"); if(mb){ if(mb.dataset.month) selectMonth(mb.dataset.month); return; }
  const vf = t.closest("[data-vf]"); if(vf){ S.vf = vf.dataset.vf; S.vi = 0; draw(); return; }
  const vs = t.closest("[data-vsort]"); if(vs){ S.vsort = vs.dataset.vsort; S.vi = 0; draw(); return; }
  const cf = t.closest("[data-cf]"); if(cf){ S.cf = cf.dataset.cf; draw(); return; }
  const so = t.closest("[data-sort]"); if(so){ S.sort = so.dataset.sort; draw(); return; }
  const dl = t.closest("[data-dl]"); if(dl){ download(dl.dataset.dl); return; }
  if(t.closest("#copyCmt")){ copyCmt(); return; }
  if(t.closest("#gLogin")){ try{ window.vfmSync.login(); }catch(_){ toast("로그인을 열지 못했어요"); } return; }
});

// ───────── 불러오기 ─────────
async function loadMonth(m){
  if(S.eds[m]) return S.eds[m];
  const r = await fetch(BASE + `${encodeURIComponent(m)}.json`, {cache:"no-store"});
  if(!r.ok) throw new Error("month "+r.status);
  S.eds[m] = await r.json(); return S.eds[m];
}
async function selectMonth(m){
  try{ await loadMonth(m); S.month = m; S.vf="all"; S.cf="all"; S.vi = 0; chip(); draw(); }
  catch(_){ toast(`${monthKo(m)}판을 불러오지 못했어요`); }
}
function chip(){
  const e = ed();
  $("#edchip").innerHTML = e ? `<b>${monthKo(e.month)}판</b>영상 ${vids(e).length} · 배댓 ${allComments(e).length}` : `<b>수집 대기</b>월간판 0개`;
}
async function boot(){
  fetch(BASE + "legend.json", {cache:"no-store"}).then(r => r.ok ? r.json() : null).then(j => { if(j){ S.LG = j; if((S.view==="videos" && S.vmode==="legend") || S.view==="today") draw(); } }).catch(()=>{});
  try{
    const r = await fetch(BASE + "index.json", {cache:"no-store"});
    const idx = r.ok ? await r.json() : {months:[]};
    S.months = (idx.months||[]).slice().sort(); S.updatedAt = idx.updatedAt || null;
    if(S.months.length){ const last = S.months[S.months.length-1]; await loadMonth(last); S.month = last;
      S.months.filter(m=>m!==last).forEach(m => loadMonth(m).then(()=>{ if(S.view==="stats") draw(); }).catch(()=>{})); }
  }catch(_){}
  chip(); draw();
  const cap = window.claude && typeof window.claude.use === "function" ? window.claude : null;
  if(!cap){ S.mode="preview"; if(S.view==="mine") draw(); return; }
  cap.use("downloads").then(d => { DL = d; if(S.view==="mine") draw(); }).catch(()=>{});
  const timer = setTimeout(() => { if(S.mode==="loading"){ S.mode="preview"; if(S.view==="mine") draw(); } }, 10000);
  try{
    const db = await cap.use("db");
    if(!db){ clearTimeout(timer); S.mode="preview"; if(S.view==="mine") draw(); return; }
    S.db = db;
    const user = await cap.use("user").catch(()=>null);
    if(user && user.can){ const w = await Promise.resolve(user.can("data.write")).catch(()=>null); S.canWrite = w !== false; } else S.canWrite = true;
    db.collection("saved").onSnapshot(snap => {
      clearTimeout(timer); const first = S.mode !== "live"; S.mode = "live";
      snap.docs.forEach(d => { S.saved[d.id] = d.data(); });
      if(document.activeElement?.matches?.("[data-memo]")) return;
      if(S.view==="mine" || first) draw(); else document.querySelectorAll("[data-save]").forEach(b => { const on = !!savedOf()[b.dataset.save]; b.setAttribute("aria-pressed", String(on)); b.textContent = on?"저장됨":"저장"; });
    }, () => { clearTimeout(timer); S.mode="preview"; if(S.view==="mine") draw(); });
  }catch(_){ clearTimeout(timer); S.mode="preview"; }
}
window.vfmApp = { back(){ if(closePlayer()) return true; if(stopPlay()) return true; if(S.view!=="today"){ go("today"); return true; } return false; }, go: h => go(String(h||"").replace(/^#/,"")), route: () => draw(), top: () => go("today") };
show(location.hash.slice(1));
boot();
})();
</script>
